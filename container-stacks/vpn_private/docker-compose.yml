name: vpn_private

services:
  wg-easy:
    container_name: wg-easy
    image: ghcr.io/wg-easy/wg-easy:15.1.0@sha256:bb8152762c36f824eb42bb2f3c5ab8ad952818fbef677d584bc69ec513b251b0
    restart: unless-stopped
    ports:
    - 51820:51820/udp
    - 51821:51821/tcp
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
      reverse_proxy:
    volumes:
    - wireguard:/etc/wireguard
    - /lib/modules:/lib/modules:ro
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.src_valid_mark=1
    - net.ipv6.conf.all.disable_ipv6=0
    - net.ipv6.conf.all.forwarding=1
    - net.ipv6.conf.default.forwarding=1
    labels:
      traefik.enable: true
      traefik.http.routers.wg-easy.entrypoints: websecure
      traefik.http.routers.wg-easy.tls: false
      traefik.http.routers.wg-easy.rule: Host(`wg-easy.${DOMAIN_PUBLIC}`)
      traefik.http.routers.wg-easy.service: wg-easy-svc
      traefik.http.services.wg-easy-svc.loadbalancer.server.port: 51821

volumes:
  wireguard:


networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
      - subnet: 10.42.42.0/24
      - subnet: fdcc:ad94:bacf:61a3::/64
  reverse_proxy:
    external: true
