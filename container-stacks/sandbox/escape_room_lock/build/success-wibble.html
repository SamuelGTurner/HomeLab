<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Unlocked</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #1b3a4b, #0f2027);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .success-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 36px 40px;
            width: min(420px, 92vw);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.8s ease-out;
        }

        .icon {
            font-size: 72px;
            margin-bottom: 16px;
            animation: pop 0.6s ease-out;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.8rem;
            letter-spacing: 0.06em;
        }

        p {
            margin: 0 0 20px;
            font-size: 1rem;
            opacity: 0.9;
        }

        .clue {
            margin-top: 16px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.35);
            font-weight: 600;
            letter-spacing: 0.08em;
            font-size: 1.1rem;
        }

        @keyframes pop {
            from {
                transform: scale(0.6);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="success-container">
        <div class="icon">🔓</div>
        <h1>Unlocked</h1>
        <p>The mechanism releases with a satisfying click.</p>

        <!-- OPTIONAL: Replace or remove this block -->
        <div class="clue">
            Congratulations!:<br />
            <span>The first round at the pub is on Sam!</span>
        </div>
    </div>
</body>

</html>
