---
name: media_library

services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:v3
    restart: unless-stopped
    # ports:
    # - 6789:6789 # nzbget
    # - 8085:8085 # qbittorrent
    networks:
      gluetun:
    volumes:
    - gluetun:/gluetun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${WIREGUARD_COUNTRY}
      UPDATER_PERIOD: 24h
      WIREGUARD_MTU: ${WIREGUARD_MTU}
      HTTPPROXY: on
      HTTPPROXY_USER: ${HTTPPROXY_USER}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD}
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 600s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s
    hostname: gluetun
    labels:
      traefik.enable: true
      traefik.http.routers.qbittorrent.entrypoints: websecure
      traefik.http.routers.qbittorrent.tls: true
      traefik.http.routers.qbittorrent.rule: Host(`qbittorrent.${DOMAIN_PUBLIC}`)
      traefik.http.routers.qbittorrent.service: qbittorrent-svc
      traefik.http.services.qbittorrent-svc.loadbalancer.server.port: 8085
      traefik.http.routers.nzbget.entrypoints: websecure
      traefik.http.routers.nzbget.tls: true
      traefik.http.routers.nzbget.rule: Host(`nzbget.${DOMAIN_PUBLIC}`)
      traefik.http.routers.nzbget.service: nzbget-svc
      traefik.http.services.nzbget-svc.loadbalancer.server.port: 6789

  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
    - qbittorrent:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8085
    network_mode: service:gluetun

  nzbget:
    container_name: nzbget
    image: lscr.io/linuxserver/nzbget:latest
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
    - nzbget:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    network_mode: service:gluetun

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    # ports:
    # - 9696:9696 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - prowlarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      traefik.enable: true
      traefik.http.routers.prowlarr.entrypoints: websecure
      traefik.http.routers.prowlarr.tls: true
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.${DOMAIN_PUBLIC}`)
      traefik.http.routers.prowlarr.service: prowlarr-svc
      traefik.http.services.prowlarr-svc.loadbalancer.server.port: 9696

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    # ports:
    # - 8989:8989 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - sonarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.entrypoints: websecure
      traefik.http.routers.sonarr.tls: false
      traefik.http.routers.sonarr.rule: Host(`sonarr.${DOMAIN_PUBLIC}`)
      traefik.http.routers.sonarr.service: sonarr-svc
      traefik.http.services.sonarr-svc.loadbalancer.server.port: 8989

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    # ports:
    # - 7878:7878 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - radarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.entrypoints: websecure
      traefik.http.routers.radarr.tls: true
      traefik.http.routers.radarr.rule: Host(`radarr.${DOMAIN_PUBLIC}`)
      traefik.http.routers.radarr.service: radarr-svc
      traefik.http.services.radarr-svc.loadbalancer.server.port: 7878

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    # ports:
    # - 6767:6767 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - bazarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      traefik.enable: true
      traefik.http.routers.bazarr.entrypoints: websecure
      traefik.http.routers.bazarr.tls: true
      traefik.http.routers.bazarr.rule: Host(`bazarr.${DOMAIN_PUBLIC}`)
      traefik.http.routers.bazarr.service: bazarr-svc
      traefik.http.services.bazarr-svc.loadbalancer.server.port: 6767

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
    # - 8096:8096 # temp until Traefik
    - 7359:7359/udp # autodiscovery
    networks:
      gluetun:
      reverse_proxy:
    volumes:
    - jellyfin:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # JELLYFIN_PublishedServerUrl: http://192.168.0.5 #optional
    labels:
      traefik.enable: true
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls: true
      traefik.http.routers.jellyfin.rule: Host(`media.${DOMAIN_PUBLIC}`)
      traefik.http.routers.jellyfin.service: jellyfin-svc
      traefik.http.services.jellyfin-svc.loadbalancer.server.port: 8096

networks:
  gluetun:
    name: gluetun
  reverse_proxy:
    external: true

volumes:
  gluetun:
  qbittorrent:
  nzbget:
  prowlarr:
  sonarr:
  radarr:
  bazarr:
  jellyfin:
