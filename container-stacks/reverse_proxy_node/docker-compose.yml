---
name: reverse_proxy_node

services:
  traefik-kop:
    container_name: traefik-kop
    image: ghcr.io/jittering/traefik-kop:0.16
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      reverse_proxy:
      docker_socket_proxy:
    environment:
      REDIS_ADDR: ${REDIS_IP}:6379
      BIND_IP: ${LOCAL_IP}
      NAMESPACE: kop
      KOP_POLL_INTERVAL: 0
      DOCKER_HOST: tcp://socket-proxy:2375
      DOCKER_CONFIG: |
        ---
        docker:
          exposedbydefault: false
          network: reverse_proxy

networks:
  reverse_proxy:
    name: reverse_proxy
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1492
  docker_socket_proxy:
    external: true
