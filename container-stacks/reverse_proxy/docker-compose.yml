name: reverse_proxy

services:
  traefik:
    image: traefik:latest

    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    command:
    - --log
    - --log.level=${LOG_LEVEL:-INFO}
    - --log.format=json
    - --api.insecure=true
    # Allow self-signed certificates for target hosts - https://doc.traefik.io/traefik/routing/overview/#insecureskipverify
    - --serversTransport.insecureSkipVerify=true

    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.http3
    - --entrypoints.websecure.http.tls=true
    - --entrypoints.websecure.http.tls.certresolver=letsencrypt

    - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
    - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/letsencrypt.json
    - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
    - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
    - --certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=0
    - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    - --certificatesresolvers.letsencrypt.acme.caServer=https://acme-v02.api.letsencrypt.org/directory # prod (default)
    # - --certificatesresolvers.letsencrypt.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory # staging

    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.docker.network=reverse_proxy
    - --providers.docker.endpoint=tcp://socket-proxy:2375
    ports:
    - 80:80
    - 443:443
    networks:
      reverse_proxy:
      docker_socket_proxy:
    volumes:
    - acme:/etc/traefik/acme
    - traefik:/config
    environment:
      TZ: ${TZ-Europe/London}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    labels:
      traefik.enable: true
      traefik.http.routers.api.rule: Host(`traefik.${ROOT_DOMAIN}`)
      traefik.http.routers.api.service: api@internal
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: true
      traefik.http.routers.api.tls.certresolver: letsencrypt
      traefik.http.services.api.loadbalancer.server.port: 8080

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    command: tunnel run
    networks:
      reverse_proxy:
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

networks:
  reverse_proxy:
    name: reverse_proxy
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1492
  docker_socket_proxy:
    external: true

volumes:
  acme:
  traefik:
