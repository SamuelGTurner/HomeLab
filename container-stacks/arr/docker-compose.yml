---
name: media_library

services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:v3
    restart: unless-stopped
    ports:
    - 6789:6789 # nzbget
    - 8085:8085 # qbittorrent
    networks:
      gluetun:
    volumes:
    - gluetun:/gluetun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${WIREGUARD_COUNTRY}
      UPDATER_PERIOD: 24h
      WIREGUARD_MTU: ${WIREGUARD_MTU}
      HTTPPROXY: on
      HTTPPROXY_USER: ${HTTPPROXY_USER}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD}
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 600s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s
    hostname: gluetun

  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
    - qbittorrent:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8085
    network_mode: service:gluetun

  nzbget:
    container_name: nzbget
    image: lscr.io/linuxserver/nzbget:latest
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
    - nzbget:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    network_mode: service:gluetun

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    ports:
    - 9696:9696 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - prowlarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
    - 8989:8989 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - sonarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
    - 7878:7878 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - radarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
    - 6767:6767 # temp until Traefik
    networks:
      gluetun:
    volumes:
    - bazarr:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
    - 8096:8096 # temp until Traefik
    - 8920:8920 # ssl
    - 7359:7359/udp
    - 1900:1900/udp
    networks:
      gluetun:
    volumes:
    - jellyfin:/config
    - ${PATH_DATA}:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # JELLYFIN_PublishedServerUrl: http://192.168.0.5 #optional

networks:
  gluetun:
    name: gluetun

volumes:
  gluetun:
  qbittorrent:
  nzbget:
  prowlarr:
  sonarr:
  radarr:
  bazarr:
  jellyfin:
